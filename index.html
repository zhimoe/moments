<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#e9e1d3">
    <meta name="description" content="把平常的日子，装订成一本本家庭相册。">
    <title>拾光集 · 家庭相册</title>
    <link rel="preload" href="albums/autumn-notes/lakeside-walk.webp" as="image" type="image/webp">
    <link rel="stylesheet" href="styles.css?v=layout-3">
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="#" aria-label="拾光集首页">
        <span class="brand-mark" aria-hidden="true">拾</span>
        <span><strong>拾光集</strong><small>FAMILY ARCHIVE</small></span>
      </a>
      <p class="edition">私人影集 · 二〇二六</p>
    </header>

    <main class="library">
      <section class="intro" aria-labelledby="page-title">
        <p class="eyebrow">THE DAYS WE KEEP</p>
        <h1 id="page-title">把平常的日子，<br><em>装订成册。</em></h1>
        <p class="intro-copy">只收藏回头看时，仍然有温度的瞬间。</p>
      </section>

      <section class="collection" aria-labelledby="collection-title">
        <div class="collection-heading">
          <h2 id="collection-title">家庭影集</h2>
          <span id="album-total"></span>
        </div>
        <div class="album-grid" id="album-grid"></div>
      </section>
    </main>

    <footer class="site-footer">
      <p>照片是时间写下的旁注。</p>
      <a href="https://zhi.moe/" aria-label="返回香取海博客">返回博客 ↗</a>
    </footer>

    <section class="reader" id="reader" aria-label="相册阅读器" aria-hidden="true">
      <div class="reader-backdrop" data-close-reader></div>
      <div class="reader-shell" role="dialog" aria-modal="true" aria-labelledby="reader-title">
        <header class="reader-header">
          <div>
            <p class="reader-kicker" id="reader-kicker"></p>
            <h2 id="reader-title"></h2>
          </div>
          <button class="close-button" type="button" data-close-reader aria-label="合上相册">
            <span>合上相册</span><i aria-hidden="true"></i>
          </button>
        </header>

        <div class="book-wrap">
          <button class="page-button page-button-prev" id="prev-page" type="button" aria-label="上一页">‹</button>
          <div class="book" id="book" aria-live="polite">
            <article class="paper paper-left" id="page-left"></article>
            <article class="paper paper-right" id="page-right"></article>
          </div>
          <button class="page-button page-button-next" id="next-page" type="button" aria-label="下一页">›</button>
        </div>

        <div class="reader-footer">
          <span class="page-count" id="page-count"></span>
          <div class="progress" aria-hidden="true"><i id="progress-bar"></i></div>
          <span class="reader-hint">点击照片可放大 · 方向键翻页</span>
        </div>
      </div>
    </section>

    <dialog class="lightbox" id="lightbox">
      <button type="button" id="lightbox-close" aria-label="关闭大图">×</button>
      <figure>
        <img id="lightbox-image" alt="">
        <figcaption id="lightbox-caption"></figcaption>
      </figure>
    </dialog>

    <script type="module" src="app.js?v=albums-1"></script>
  </body>
</html>
